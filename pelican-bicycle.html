<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG 鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root{
    --ink:#1f2a37;
    --paper:#f3f5f9;
    --card:#ffffff;
    --accent:#ef6c33;
    --line:#d7dee8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:28px 18px 34px;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, #eef2f8 45%, #e3e9f2 100%);
  }
  header{text-align:center;max-width:900px}
  h1{
    margin:0 0 6px;
    font-size:clamp(19px,2.6vw,28px);
    letter-spacing:.01em;
    font-weight:650;
  }
  h1 span{color:var(--accent)}
  p.sub{
    margin:0;
    font-size:clamp(12px,1.5vw,14px);
    color:#5b6b7f;
    line-height:1.6;
  }
  .stage{
    width:min(1000px,96vw);
    border-radius:20px;
    overflow:hidden;
    background:var(--card);
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 18px 44px -18px rgba(16,24,40,.35);
    border:1px solid rgba(215,222,232,.9);
    line-height:0;
  }
  .stage svg{display:block;width:100%;height:auto}
  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap:14px 22px;
    padding:12px 18px;
    background:linear-gradient(180deg,#fbfcfe,#f4f7fb);
    border-top:1px solid var(--line);
    line-height:1.4;
  }
  button{
    font:inherit;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    box-shadow:0 1px 2px rgba(16,24,40,.05);
    transition:background .16s, border-color .16s, transform .12s;
  }
  button:hover{background:#f7f9fc;border-color:#bfcadd}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button .dot{
    width:9px;height:9px;border-radius:50%;
    background:#22a06b;
    box-shadow:0 0 0 3px rgba(34,160,107,.16);
    transition:background .16s, box-shadow .16s;
  }
  button[aria-pressed="true"] .dot{background:#e0574a;box-shadow:0 0 0 3px rgba(224,87,74,.16)}
  label.speed{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:#5b6b7f;
    font-weight:600;
  }
  input[type="range"]{
    width:150px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  output{
    font-variant-numeric:tabular-nums;
    min-width:42px;
    text-align:right;
    color:var(--ink);
  }
  footer.hint{
    font-size:12px;
    color:#7c8ba1;
    text-align:center;
    line-height:1.7;
  }
  kbd{
    font:inherit;font-size:11px;
    background:#fff;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;
  }
  @media (prefers-reduced-motion:reduce){ .stage{transition:none} }
</style>
</head>

<div class="controls">
  <button id="toggle" type="button" aria-pressed="false"><span class="dot"></span><span id="toggleText">暂停</span></button>
  <label class="speed" for="rate">踏频 <input id="rate" type="range" min="0.3" max="2.4" step="0.1" value="1"><output id="rateOut">1.0×</output></label>
  <label class="speed" for="crankSlider">曲柄相位 <input id="crankSlider" type="range" min="0" max="359" step="1" value="0"><output id="crankOut">0°</output></label>
</div>

<footer class="hint">
  按 <kbd>空格</kbd> 暂停 / 继续 · 拖动“曲柄相位”可逐帧检查腿部动作与踏板是否咬合
</footer>

<script>
(function () {
  "use strict";

  /* ---------------- 场景常量（与 SVG 坐标一致） ---------------- */
  var CRANK = { x: 614, y: 396, r: 36 };   // 中轴 + 曲柄半径
  var HIP   = { x: 556, y: 234 };          // 髋关节
  var THIGH = 70;                          // 大腿骨长
  var SHIN  = 72;                          // 小腿骨长
  var PERIOD = 1.15;                       // 单圈蹬踏周期（秒，1× 速度）
  var WHEEL_RATIO = 2.2;                   // 车轮 / 曲柄 转速比
  var PHASE_BACK = 0.5;                    // 远侧腿相位差（半圈）

  var svg     = document.getElementById("art");
  var stage   = document.getElementById("stage");
  var btn     = document.getElementById("toggle");
  var btnText = document.getElementById("toggleText");
  var rateIn  = document.getElementById("rate");
  var rateOut = document.getElementById("rateOut");
  var phaseIn = document.getElementById("crankSlider");
  var phaseOut= document.getElementById("crankOut");

  var legFront       = document.getElementById("legFront");
  var legBack        = document.getElementById("legBack");
  var frontThigh     = legFront.querySelector(".thigh");
  var frontShin      = legFront.querySelector(".shin");
  var frontFoot      = legFront.querySelector(".foot");
  var backThigh      = legBack.querySelector(".thigh");
  var backShin       = legBack.querySelector(".shin");
  var backFoot       = legBack.querySelector(".foot");
  var cranks         = Array.prototype.slice.call(document.querySelectorAll(".crank"));

  [frontThigh, frontShin, frontFoot].forEach(cssAnim);
  [backThigh, backShin, backFoot].forEach(cssAnim);
  cranks.forEach(cssAnim);

  function cssAnim(el) {
    el.style.animationDuration = PERIOD + "s";
    el.style.animationIterationCount = "infinite";
    el.style.animationTimingFunction = "linear";
  }

  /* 车轮：CSS 转发动画（与曲柄同源，保证转速比恒定） */
  Array.prototype.forEach.call(document.querySelectorAll(".spin"), function (el) {
    el.style.animation = "spin " + (PERIOD / WHEEL_RATIO).toFixed(4) + "s linear infinite";
  });

  /* ---------------- 逆向运动学：由踏板位置反推大腿 / 小腿角度 ---------------- */
  var DEG = 180 / Math.PI;
  function solveLeg(hip, pedal, l1, l2) {
    var dx = pedal.x - hip.x, dy = pedal.y - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var dmax = (l1 + l2) * 0.995;          // 留出一点点余量，避免骨骼拉直
    var dmin = Math.abs(l1 - l2) * 1.05;
    var clamped = Math.min(Math.max(d, dmin), dmax) / (d || 1);
    dx *= clamped; dy *= clamped;
    d = Math.sqrt(dx * dx + dy * dy);
    var phi = Math.atan2(dy, dx);
    var cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    cosA = Math.min(1, Math.max(-1, cosA));
    var A = Math.acos(cosA);               // 髋角（相对髋→踏板连线）
    var thighAngle = (phi - A) * DEG;      // 膝盖向前弯（屏幕坐标 y 向下）
    var kx = hip.x + l1 * Math.cos(thighAngle / DEG);
    var ky = hip.y + l1 * Math.sin(thighAngle / DEG);
    var shinAngle = Math.atan2(pedal.y - ky, pedal.x - kx) * DEG;
    return { thigh: thighAngle, shin: shinAngle - thighAngle };
  }

  /* ---------------- 帧驱动 ---------------- */
  var t = 0, running = true, rate = 1, manual = null;
  var last = 0;

  function pedalPos(phaseTurns) {
    var a = phaseTurns * Math.PI * 2;
    return { x: CRANK.x + CRANK.r * Math.cos(a), y: CRANK.y + CRANK.r * Math.sin(a), rad: a * DEG };
  }

  function applyPose(phaseTurns) {
    var crankDeg = phaseTurns * 360;
    var p = pedalPos(phaseTurns);

    var f = solveLeg(HIP, p, THIGH, SHIN);
    frontThigh.style.transform = "rotate(" + f.thigh.toFixed(2) + "deg)";
    frontShin.style.transform  = "rotate(" + f.shin.toFixed(2) + "deg)";
    frontFoot.style.transform  = "rotate(" + ((crankDeg + 16) % 360).toFixed(2) + "deg)";

    var pb = pedalPos(phaseTurns + PHASE_BACK);
    var b = solveLeg(HIP, pb, THIGH, SHIN);
    backThigh.style.transform = "rotate(" + b.thigh.toFixed(2) + "deg)";
    backShin.style.transform  = "rotate(" + b.shin.toFixed(2) + "deg)";
    backFoot.style.transform  = "rotate(" + ((crankDeg + 180 + 16) % 360).toFixed(2) + "deg)";
  }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) t = (t + dt * rate / PERIOD) % 1;
    var phase = (manual === null) ? t : manual;
    applyPose(phase);
    phaseOut.textContent = Math.round(phase * 360) % 360 + "°";
    requestAnimationFrame(frame);
  }

  /* ---------------- 控件 ---------------- */
  function setRunning(v) {
    running = v;
    btn.setAttribute("aria-pressed", v ? "false" : "true");
    btnText.textContent = v ? "暂停" : "继续";
    // 车轮与曲柄的 CSS 动画与 JS 时间轴同速，暂停时一并冻结
    stage.classList.toggle("frozen", !v);
  }

  btn.addEventListener("click", function () { setRunning(!running); });

  rateIn.addEventListener("input", function () {
    rate = parseFloat(rateIn.value);
    rateOut.textContent = rate.toFixed(1) + "×";
    applyRate();
  });

  function applyRate() {
    var dur = PERIOD / rate;
    [frontThigh, frontShin, frontFoot, backThigh, backShin, backFoot].forEach(function (el) {
      el.style.animationDuration = dur + "s";
    });
    cranks.forEach(function (el) { el.style.animationDuration = dur + "s"; });
    Array.prototype.forEach.call(document.querySelectorAll(".spin"), function (el) {
      el.style.animation = "spin " + (dur / WHEEL_RATIO).toFixed(4) + "s linear infinite";
    });
  }

  phaseIn.addEventListener("input", function () {
    var v = parseInt(phaseIn.value, 10) / 360;
    if (manual === null) manual = v;
    else manual = v;
    phaseOut.textContent = parseInt(phaseIn.value, 10) + "°";
  });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      setRunning(!running);
    }
  });

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setRunning(!reduce);
  applyRate();
  requestAnimationFrame(frame);
})();
</script>

<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #stage.frozen .spin,
  #stage.frozen .crank { animation-play-state: paused; }
  #stage.frozen .whoosh path { opacity: .18; transition: opacity .3s; }
  .whoosh path { transition: opacity .3s; }
  .crank { transform-box: fill-box; }
</style>
</body>
