<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% 0%, #f0f9ff, #cfe4f5 58%, #b6d2e8);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .stage {
    width: min(920px, 100%);
    aspect-ratio: 4 / 3;
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 20px 46px rgba(18, 58, 88, .30), inset 0 2px 0 rgba(255, 255, 255, .7);
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  h1 {
    margin: 0;
    font-size: clamp(16px, 2.4vw, 24px);
    font-weight: 700;
    letter-spacing: .1em;
    color: #16405c;
  }
  .hint { margin: 0; font-size: 13px; color: #3d6a8a; }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鹈鹕骑自行车</title>
  <desc id="svgDesc">一只白色鹈鹕坐在自行车座上，翅膀扶着车把，长喙的喉囊里叼着一条小鱼，车轮正在转动。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e2ff"/>
      <stop offset=".60" stop-color="#e6f5ff"/>
      <stop offset="1" stop-color="#f7fcf4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6bd"/>
      <stop offset=".55" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plume" cx=".35" cy=".28" r=".9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#e2d8c6"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33a897"/>
      <stop offset="1" stop-color="#1a6a61"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc95f"/>
      <stop offset="1" stop-color="#f0912a"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#ffd992"/>
      <stop offset="1" stop-color="#f6a445"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3c97f"/>
      <stop offset="1" stop-color="#6d9a54"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="694" cy="106" r="86" fill="url(#sunGlow)"/>
  <circle cx="694" cy="106" r="42" fill="#ffd75e"/>

  <g fill="#ffffff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 34 0; 0 0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="140" cy="118" rx="46" ry="26"/>
      <ellipse cx="184" cy="126" rx="34" ry="20"/>
      <ellipse cx="104" cy="130" rx="30" ry="17"/>
    </g>
    <g opacity=".8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -28 0; 0 0" dur="18s" repeatCount="indefinite"/>
      <ellipse cx="470" cy="86" rx="38" ry="20"/>
      <ellipse cx="506" cy="94" rx="26" ry="15"/>
      <ellipse cx="440" cy="96" rx="24" ry="13"/>
    </g>
  </g>

  <g fill="none" stroke="#7fa9c6" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M 268 176 q 12 -10 24 0"/>
    <path d="M 292 176 q 12 -10 24 0"/>
    <path d="M 620 208 q 9 -8 18 0"/>
    <path d="M 638 208 q 9 -8 18 0"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="500" width="800" height="100" fill="url(#groundGrad)"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#5d8546" stroke-width="4"/>
  <ellipse cx="400" cy="502" rx="200" ry="12" fill="#2f4a2a" opacity=".16"/>

  <!-- ===== 速度线 ===== -->
  <g stroke="#8dbbd8" stroke-width="7" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 0; -90 0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; .9; .9; 0" keyTimes="0; .12; .6; 1" dur="1.1s" repeatCount="indefinite"/>
      <line x1="120" y1="372" x2="196" y2="372"/>
      <line x1="70" y1="424" x2="176" y2="424"/>
      <line x1="130" y1="474" x2="188" y2="474"/>
    </g>
  </g>

  <!-- ===== 车轮 ===== -->
  <g transform="translate(250,430)">
    <circle r="70" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle r="61" fill="none" stroke="#c6ccd4" stroke-width="4"/>
    <g stroke="#b4bcc6" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <line y1="-58" y2="58"/>
      <line y1="-58" y2="58" transform="rotate(30)"/>
      <line y1="-58" y2="58" transform="rotate(60)"/>
      <line y1="-58" y2="58" transform="rotate(90)"/>
      <line y1="-58" y2="58" transform="rotate(120)"/>
      <line y1="-58" y2="58" transform="rotate(150)"/>
    </g>
    <circle r="9" fill="#4a5560"/>
    <circle r="3.5" fill="#c6ccd4"/>
  </g>

  <g transform="translate(550,430)">
    <circle r="70" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle r="61" fill="none" stroke="#c6ccd4" stroke-width="4"/>
    <g stroke="#b4bcc6" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <line y1="-58" y2="58"/>
      <line y1="-58" y2="58" transform="rotate(30)"/>
      <line y1="-58" y2="58" transform="rotate(60)"/>
      <line y1="-58" y2="58" transform="rotate(90)"/>
      <line y1="-58" y2="58" transform="rotate(120)"/>
      <line y1="-58" y2="58" transform="rotate(150)"/>
    </g>
    <circle r="9" fill="#4a5560"/>
    <circle r="3.5" fill="#c6ccd4"/>
  </g>

  <!-- ===== 车架 ===== -->
  <g fill="none" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round">
    <line x1="250" y1="430" x2="390" y2="430"/>
    <line x1="250" y1="430" x2="337" y2="298"/>
    <line x1="390" y1="430" x2="337" y2="298"/>
    <line x1="390" y1="430" x2="540" y2="348"/>
    <line x1="337" y1="302" x2="518" y2="293"/>
    <line x1="516" y1="292" x2="540" y2="348"/>
  </g>
  <path d="M 540 348 C 546 376 549 404 550 430" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>

  <!-- 车座 -->
  <path d="M 296 292 C 300 281 344 278 358 285 C 364 288 362 296 350 299 C 330 304 302 303 296 292 Z"
        fill="#4a3626" stroke="#33251a" stroke-width="2"/>

  <!-- 传动系统 -->
  <circle cx="250" cy="430" r="11" fill="#5a6570"/>
  <path d="M250 421 L390 411 M250 439 L390 449" fill="none" stroke="#7c8894" stroke-width="4" stroke-dasharray="6 4"/>
  <circle cx="390" cy="430" r="19" fill="none" stroke="#5a6570" stroke-width="6"/>
  <circle cx="390" cy="430" r="19" fill="none" stroke="#9aa6b2" stroke-width="2" stroke-dasharray="3 4"/>
  <line x1="390" y1="430" x2="362" y2="414" stroke="#6b7681" stroke-width="7" stroke-linecap="round"/>
  <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#2f3a44" transform="translate(362,414) rotate(-16)"/>

  <!-- ===== 远侧腿 ===== -->
  <path d="M 326 304 L 348 358 L 362 414" fill="none" stroke="#cf8a2b" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 350 406 C 344 414 350 424 362 424 C 372 424 376 416 370 408 Z" fill="#cf8a2b"/>

  <!-- ===== 鹈鹕 ===== -->
  <!-- 尾羽 -->
  <path d="M 272 250 C 244 230 210 222 188 228 C 206 242 216 254 210 270 C 234 268 256 266 272 262 Z"
        fill="#efe7d6" stroke="#d5cab5" stroke-width="2" stroke-linejoin="round"/>

  <!-- 身体 -->
  <ellipse cx="330" cy="262" rx="68" ry="53" fill="url(#plume)" stroke="#dcd2c0" stroke-width="2"/>
  <ellipse cx="342" cy="288" rx="45" ry="26" fill="#eee5d3" opacity=".85"/>

  <!-- 脖子 -->
  <path d="M 336 252 C 350 200 384 158 414 132 L 444 156 C 410 184 380 216 364 256 Z"
        fill="#fbf7ef" stroke="#ded3bf" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 414 134 C 400 156 382 182 366 210" fill="none" stroke="#e6dcc8" stroke-width="5" stroke-linecap="round"/>

  <!-- 头 -->
  <path d="M 416 106 C 406 92 410 80 424 76 C 419 88 424 96 434 100 Z" fill="#f3ebda"/>
  <circle cx="436" cy="126" r="28" fill="url(#plume)" stroke="#dcd2c0" stroke-width="2"/>

  <!-- 喙 -->
  <path d="M 448 125 C 458 206 556 206 586 132 C 552 146 486 142 448 125 Z"
        fill="url(#pouchGrad)" stroke="#e2912f" stroke-width="1.8"/>
  <g fill="none" stroke="#e79b38" stroke-width="1.6" opacity=".8">
    <path d="M 470 132 C 476 164 494 182 516 188"/>
    <path d="M 500 136 C 508 160 524 174 544 180"/>
  </g>
  <path d="M 450 102 L 592 124 L 584 137 L 448 125 Z" fill="url(#beakGrad)" stroke="#d9821f" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 464 112 L 502 118" fill="none" stroke="#d9821f" stroke-width="1.6" opacity=".7"/>

  <!-- 喉囊里的小鱼 -->
  <path d="M 588 122 L 620 104 L 611 126 L 628 142 L 590 133 Z" fill="#a8d8ee" stroke="#5fa8cc" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="606" cy="120" r="2.6" fill="#2b3a44"/>

  <!-- 眼睛 -->
  <circle cx="447" cy="115" r="6.2" fill="#2b2b2b"/>
  <circle cx="445" cy="112.6" r="2.2" fill="#ffffff"/>

  <!-- 翅膀（扶车把） -->
  <path d="M 362 228 C 404 240 452 262 512 284 L 538 292 C 546 296 545 306 534 306 C 470 300 414 291 372 275 C 344 264 338 234 362 228 Z"
        fill="#f8f4ea" stroke="#d9cfbb" stroke-width="2" stroke-linejoin="round"/>
  <g fill="none" stroke="#cdc1a9" stroke-width="2.4" stroke-linecap="round">
    <path d="M 396 262 C 408 272 422 280 438 286"/>
    <path d="M 432 274 C 444 283 458 290 474 294"/>
    <path d="M 470 286 C 482 292 496 297 510 299"/>
  </g>

  <!-- 车把（压在翅膀上） -->
  <g fill="none" stroke="#2f3a44" stroke-width="9" stroke-linecap="round">
    <path d="M 516 292 C 522 281 538 278 552 285"/>
  </g>
  <circle cx="554" cy="286" r="7.5" fill="#1f2933"/>

  <!-- ===== 近侧曲柄 + 近侧腿 ===== -->
  <line x1="390" y1="430" x2="418" y2="446" stroke="#8794a0" stroke-width="8" stroke-linecap="round"/>
  <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#3a4750" transform="translate(418,446) rotate(-16)"/>
  <path d="M 344 302 L 374 374 L 418 444" fill="none" stroke="#f0a63c" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 344 302 L 374 374 L 418 444" fill="none" stroke="#ffc264" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <path d="M 402 438 C 396 450 404 462 420 460 C 434 458 436 446 430 438 Z"
        fill="#f0a63c" stroke="#d9821f" stroke-width="1.6"/>

  <!-- 地面草丛 -->
  <g fill="none" stroke="#5d8546" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M 96 524 q 6 -16 14 -22"/>
    <path d="M 112 526 q 2 -18 10 -24"/>
    <path d="M 704 522 q 6 -16 14 -22"/>
    <path d="M 722 526 q 2 -18 10 -24"/>
  </g>
</svg>
</div>

<h1>鹈鹕骑自行车</h1>
<p class="hint">纯 HTML + 内联 SVG，无外部依赖；车轮与速度线为 SMIL 动画。</p>

</body>
</html>
